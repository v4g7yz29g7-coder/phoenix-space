<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Dev — студия разработки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #0a0a0f;
            color: #e8e8f0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background-image: radial-gradient(circle at 20% 20%, rgba(88, 101, 242, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.06) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(88, 101, 242, 0.15);
            border: 1px solid rgba(88, 101, 242, 0.3);
            color: #a5b4fc;
            padding: 0.4rem 1.2rem;
            border-radius: 100px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            margin-bottom: 2rem;
            text-transform: uppercase;
            font-weight: 500;
        }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: #9ca3af;
            max-width: 700px;
            margin: 0 auto 4rem auto;
            font-weight: 300;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #5865f2, #a855f7);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(88, 101, 242, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            display: block;
        }

        .service-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .service-card p {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .service-tag {
            display: inline-block;
            background: rgba(88, 101, 242, 0.1);
            color: #a5b4fc;
            padding: 0.3rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #5865f2 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            padding: 1.2rem 3.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.3);
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(88, 101, 242, 0.5);
            background: linear-gradient(135deg, #4f5bd5 0%, #6d28d9 100%);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .cta-button::after {
            content: '→';
            margin-left: 0.8rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .cta-button:hover::after {
            transform: translateX(5px);
        }

        .footer-note {
            margin-top: 3rem;
            color: #4b5563;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

                grid-template-columns: 1
