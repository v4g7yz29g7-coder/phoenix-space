<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐋 Aeon Arena — Autonomous Evolution</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a0e1a;
  color: #e0e6f0;
  min-height: 100vh;
  background-image: radial-gradient(ellipse at top, #1a1f3a 0%, #0a0e1a 60%);
}
.container { max-width: 1400px; margin: 0 auto; padding: 30px 20px; }
header { text-align: center; margin-bottom: 40px; }
h1 {
  font-size: 3em; font-weight: 900; letter-spacing: 4px;
  background: linear-gradient(90deg, #4dd0ff, #a855f7, #ff7eb6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 10px;
}
.subtitle { color: #7a8baa; font-size: 1.1em; letter-spacing: 2px; }
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px; margin-bottom: 40px;
}
.stat-card {
  background: rgba(30, 40, 70, 0.5);
  border: 1px solid rgba(77, 208, 255, 0.2);
  border-radius: 12px; padding: 20px; text-align: center;
  backdrop-filter: blur(10px); transition: all 0.3s;
}
.stat-card:hover { border-color: rgba(77, 208, 255, 0.5); transform: translateY(-2px); }
.stat-value {
  font-size: 2.5em; font-weight: 800;
  background: linear-gradient(135deg, #4dd0ff, #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.stat-label { color: #7a8baa; font-size: 0.85em; margin-top: 5px; text-transform: uppercase; letter-spacing: 1.5px; }
.section { margin-bottom: 40px; }
.section-title {
  font-size: 1.4em; font-weight: 700; margin-bottom: 20px;
  color: #4dd0ff; letter-spacing: 2px;
  display: flex; align-items: center; gap: 10px;
}
table { width: 100%; border-collapse: collapse; background: rgba(20, 26, 45, 0.6); border-radius: 12px; overflow: hidden; }
th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid rgba(77, 208, 255, 0.1); }
th { background: rgba(30, 40, 70, 0.9); color: #7a8baa; font-size: 0.8em; text-transform: uppercase; letter-spacing: 1.5px; }
td { font-size: 0.95em; }
tr:last-child td { border-bottom: none; }
tr:hover { background: rgba(77, 208, 255, 0.05); }
.rank { font-weight: 900; font-size: 1.2em; }
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }
.box-name { font-weight: 700; color: #4dd0ff; }
.score { color: #6eff8b; font-weight: 700; }
.time { color: #ffb86b; }
.fails { color: #ff5c5c; }
.races-list { display: grid; gap: 12px; }
.race-item {
  background: rgba(20, 26, 45, 0.6);
  border-left: 3px solid #4dd0ff;
  border-radius: 8px; padding: 15px 20px;
  display: flex; justify-content: space-between; align-items: center; gap: 20px;
  transition: all 0.2s;
}
.race-item:hover { background: rgba(30, 40, 70, 0.8); transform: translateX(3px); }
.race-task { flex: 1; color: #c0cce0; font-size: 0.95em; }
.race-winner { font-weight: 700; color: #ffd700; white-space: nowrap; }
.race-time { color: #7a8baa; font-size: 0.85em; white-space: nowrap; }
.skills-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
.skill-card {
  background: rgba(20, 26, 45, 0.6);
  border: 1px solid rgba(168, 85, 247, 0.3);
  border-radius: 10px; padding: 18px; transition: all 0.3s;
}
.skill-card:hover { border-color: rgba(168, 85, 247, 0.7); transform: translateY(-3px); }
.skill-title { font-weight: 700; color: #a855f7; margin-bottom: 8px; font-size: 1.05em; }
.skill-purpose { color: #7a8baa; font-size: 0.85em; line-height: 1.5; }
.loading { text-align: center; color: #7a8baa; padding: 40px; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AEON ARENA</h1>
    <div class="subtitle">Autonomous Evolution for Multi-Agent Systems</div>
  </header>

  <div class="stats-grid" id="stats">
    <div class="loading">Загрузка...</div>
  </div>

  <div class="section">
    <div class="section-title">🏆 Лидерборд</div>
    <table>
      <thead><tr><th>#</th><th>Бокс</th><th>Победы</th><th>Средний score</th><th>Среднее время</th><th>Провалы</th></tr></thead>
      <tbody id="leaderboard"><tr><td colspan="6" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">🏁 Последние гонки</div>
    <div class="races-list" id="races"><div class="loading">Загрузка...</div></div>
  </div>

  <div class="section">
    <div class="section-title">📚 Скиллы (эволюция)</div>
    <div class="skills-grid" id="skills"><div class="loading">Загрузка...</div></div>
  </div>
</div>

<script>
async function loadStats() {
  const r = await fetch('/api/stats').then(r => r.json());
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="stat-value">${r.racesCount}</div><div class="stat-label">Гонок</div></div>
    <div class="stat-card"><div class="stat-value">${r.patternsCount}</div><div class="stat-label">Паттернов</div></div>
    <div class="stat-card"><div class="stat-value">${r.skillsCount}</div><div class="stat-label">Скиллов</div></div>
    <div class="stat-card"><div class="stat-value">3</div><div class="stat-label">Боксов</div></div>
  `;
}

async function loadLeaderboard() {
  const r = await fetch('/api/leaderboard').then(r => r.json());
  const tbody = document.getElementById('leaderboard');
  tbody.innerHTML = r.leaderboard.map((b, i) => `
    <tr>
      <td class="rank ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</td>
      <td class="box-name">${b.box}</td>
      <td><strong>${b.wins}</strong></td>
      <td class="score">${b.avgScore || '—'}</td>
      <td class="time">${b.avgTime ? b.avgTime + 'ms' : '—'}</td>
      <td class="fails">${b.fails || 0}</td>
    </tr>
  `).join('');
}

async function loadRaces() {
  const races = await fetch('/api/races').then(r => r.json());
  document.getElementById('races').innerHTML = races.slice(0, 10).map(r => `
    <div class="race-item">
      <div class="race-task">${escapeHtml(r.task)}</div>
      <div class="race-winner">🥇 ${r.winner} (${r.winner_score})</div>
      <div class="race-time">${r.winner_time}ms</div>
    </div>
  `).join('');
}

async function loadSkills() {
  const skills = await fetch('/api/skills').then(r => r.json());
  document.getElementById('skills').innerHTML = skills.map(s => `
    <div class="skill-card">
      <div class="skill-title">${escapeHtml(s.title)}</div>
      <div class="skill-purpose">${escapeHtml(s.purpose)}</div>
    </div>
  `).join('');
}

function escapeHtml(t) {
  return (t || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

loadStats();
loadLeaderboard();
loadRaces();
loadSkills();
setInterval(() => { loadStats(); loadLeaderboard(); loadRaces(); }, 30000);
</script>
</body>
</html>
