<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFlow — Тарифы</title>
  <!-- Подключение шрифта Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome для иконок (опционально, для галочек) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0b0f; /* глубокий тёмный фон */
      font-family: 'Inter', sans-serif;
      color: #e5e5e5;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* Заголовок страницы */
    .pricing-header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    .pricing-header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }

    .pricing-header p {
      font-size: 1.2rem;
      color: #a1a1aa;
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Сетка карточек */
    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      align-items: stretch;
    }

    /* Карточка тарифа */
    .pricing-card {
      background: #131318;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.8);
    }

    .pricing-card:hover {
      transform: translateY(-6px);
      border-color: rgba(167, 139, 250, 0.3);
      box-shadow: 0 30px 50px -20px rgba(167, 139, 250, 0.15);
    }

    /* Акцентная карточка (Pro — популярный) */
    .pricing-card.featured {
      background: linear-gradient(145deg, #17121f 0%, #131318 100%);
      border: 1px solid #a78bfa;
      box-shadow: 0 0 0 1px rgba(167, 139, 250, 0.2), 0 20px 50px -20px rgba(167, 139, 250, 0.3);
      position: relative;
    }

    .pricing-card.featured::before {
      content: "★ ПОПУЛЯРНЫЙ";
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: #a78bfa;
      color: #0b0b0f;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Название тарифа */
    .plan-name {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .plan-price {
      display: flex;
      align-items: baseline;
      gap: 0.25rem;
      margin-bottom: 1.5rem;
    }

    .price-value {
      font-size: 3.2rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.03em;
    }

    .price-period {
      font-size: 1rem;
      color: #a1a1aa;
      font-weight: 400;
    }

    /* Список возможностей */
    .plan-features {
      list-style: none;
      margin: 1.5rem 0 2rem;
      flex-grow: 1;
    }

    .plan-features li {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.9rem;
      font-size: 0.95rem;
      color: #d4d4d8;
      font-weight: 400;
    }

    .plan-features li i {
      color: #a78bfa;
      font-size: 0.9rem;
      margin-top: 0.2rem;
      min-width: 1.2rem;
    }

    .plan-features li .feature-text {
      flex: 1;
    }

    .plan-features li .muted {
      color: #71717a;
      font-size: 0.85rem;
    }

    /* Кнопка */
    .btn-plan {
      display: inline-block;
      width: 100%;
      text-align:</div>
  <script src="app.js"></script>
</body>
</html>
