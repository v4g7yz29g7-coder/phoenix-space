<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFlow — фото‑сервис с AI</title>
  <!-- базовые сбросы и шрифт -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0e0e12;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e9e9f0;
      line-height: 1.5;
    }
    /* акцентный фиолетовый */
    :root {
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.15);
      --card-bg: #1a1a22;
      --border-dim: #2c2c3a;
    }
    #app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }
    /* шапка */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border-dim);
      flex-wrap: wrap;
    }
    .logo {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(130deg, #fff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    .nav-links a {
      color: #c9c9de;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }
    .nav-links a:hover {
      color: var(--accent);
    }
    .btn-login {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-login:hover {
      background: var(--accent-soft);
    }
    /* hero */
    .hero {
      text-align: center;
      padding: 70px 0 50px;
    }
    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
      max-width: 900px;
      margin: 0 auto 20px;
      letter-spacing: -1px;
      line-height: 1.2;
      background: linear-gradient(135deg, #f0efff 0%, var(--accent) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      font-size: 1.3rem;
      color: #a5a5b8;
      max-width: 700px;
      margin: 0 auto 40px;
    }
    .hero-buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      padding: 14px 32px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.1rem;
      color: #0b0b0f;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 20px rgba(167, 139, 250, 0.2);
    }
    .btn-primary:hover {
      background: #b79ffa;
      transform: scale(1.02);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #4a4a5a;
      padding: 14px 32px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 1.1rem;
      color: #ddd;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    /* секция загрузки */
    .upload-section {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 40px 30px;
      margin: 30px 0 60px;
      border: 1px solid var(--border-dim);
    }
    .upload-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .upload-area {
      background: #12121a;
      border: 2px dashed #3a3a4a;
      border-radius: 24px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .upload-area:hover {
      border-color: var(--accent);
      background: #17171f;
    }
    .upload-area input[type="file"] {
      display: none;
    }
    .upload-label {
      font-size: 1.2rem;
      color: #b0b0c8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .upload-icon {
      font-size: 3rem;
      color: var(--accent);
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
      margin-top: 30px;
    }
    .preview-item {
      background: #1f1f2b;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1/1;
      border: 1px solid #2e2e3e;
      position: relative;
    }
    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .layout-panel {
      margin: 30px 0 20px;
    }
    .layout-panel h3 {
      font-size: 1.</div>
  <script src="app.js"></script>
</body>
</html>
