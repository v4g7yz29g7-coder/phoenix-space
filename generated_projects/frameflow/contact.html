<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFlow — контакты</title>
  <!-- шрифт и базовые сбросы для аккуратного вида -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f7f9fc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    /* карточка контактов — только внутренности #app */
    #app {
      width: 100%;
      max-width: 1000px;
      background: white;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.15);
      padding: 2.5rem 2rem;
    }
    /* сетка контактов: инфо + форма */
    .contacts-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
      align-items: start;
    }
    /* левая часть — заголовок, текст, соцсети */
    .contact-info h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: #0f172a;
    }
    .contact-info .highlight {
      color: #4f46e5;
    }
    .contact-info p {
      color: #475569;
      margin-bottom: 1.8rem;
      font-size: 1rem;
    }
    .contact-details {
      list-style: none;
      margin-bottom: 2rem;
    }
    .contact-details li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-weight: 500;
      color: #1e293b;
    }
    .contact-details li svg {
      flex-shrink: 0;
      color: #4f46e5;
    }
    .social-row {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #eef2ff;
      color: #4f46e5;
      transition: 0.2s ease;
      text-decoration: none;
    }
    .social-link:hover {
      background: #4f46e5;
      color: white;
      transform: translateY(-2px);
    }
    /* правая часть — форма */
    .contact-form-wrap {
      background: #f8fafc;
      border-radius: 2rem;
      padding: 2rem 1.8rem;
      border: 1px solid #e2e8f0;
    }
    .contact-form-wrap h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }
    .contact-form-wrap .form-sub {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.8rem;
    }
    .form-group {
      margin-bottom: 1.3rem;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      color: #334155;
    }
    input, textarea {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      background: white;
      transition: border 0.2s, box-shadow 0.2s;
      resize: vertical;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }
    textarea {
      min-height: 120px;
    }
    .btn-submit {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      box-shadow: 0 8px 16px -6px rgba(79, 70, 229, 0.3);
    }
    .btn-submit:hover {
      background: #4338ca;
      transform: translateY(-1px);
      box-shadow: 0 12px 20px -8px rgba(79, 70, 229, 0.4);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    /* маленькие детали */
    .badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-block;
      margin-bottom: 1rem;
    }
    hr {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 1.5rem 0 1rem;
    }
    .</div>
  <script src="app.js"></script>
</body>
</html>
