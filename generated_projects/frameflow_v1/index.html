<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная</title>
  <link rel="stylesheet" href="style.css">

<body>
  <div id="app"><!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFlow — фото-сервис с AI</title>
  <!-- базовые сбросы и шрифт -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0b0f;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e9e9f0;
      line-height: 1.5;
    }
    /* акцентный фиолетовый */
    :root {
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.12);
      --card-bg: #15151d;
      --border: #2a2a35;
      --text-dim: #9b9bb0;
    }
    #app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }
    /* навигация */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .logo {
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    .nav-links a {
      color: #d3d3e2;
      text-decoration: none;
      font-weight: 500;
      transition: 0.2s;
    }
    .nav-links a:hover {
      color: var(--accent);
    }
    .btn-login {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 8px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .btn-login:hover {
      background: var(--accent-soft);
    }
    /* hero */
    .hero {
      padding: 70px 0 50px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: 3.2rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    .hero h1 span {
      background: linear-gradient(120deg, var(--accent), #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero p {
      font-size: 1.2rem;
      color: var(--text-dim);
      margin-bottom: 36px;
    }
    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      color: #0b0b0f;
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 60px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 8px 20px rgba(167, 139, 250, 0.25);
    }
    .btn-primary:hover {
      background: #b79cfb;
      transform: scale(1.02);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: #e0e0ec;
      padding: 14px 32px;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    /* секция загрузки */
    .upload-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px;
      margin: 40px 0 60px;
    }
    .upload-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .upload-header h2 {
      font-size: 1.8rem;
      font-weight: 600;
    }
    .file-label {
      background: var(--accent-soft);
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 12px 24px;
      border-radius: 60px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
    }
    .file-label:hover {
      background: rgba(167, 139, 250, 0.2);
    }
    #file-input {
      display: none;
    }
    /* превью сетка */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
      margin: 24px 0 28px;
      min-height: 80px;
    }
    .preview-item {
      background: #1e1e2a;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .empty-preview {
      grid-column: 1 / -1;
      color: var(--text-dim);
      text-align: center;
      padding: 30</div>
  <script src="app.js"></script>
</body>
</html>
