<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><title>Контакты</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header class="site-header"><div class="container header-inner"><a href="index.html" class="logo">FrameFlow</a><nav class="main-nav"><a href="index.html">Главная</a><a href="about.html">О нас</a><a href="tariffs.html">Тарифы</a><a href="contact.html">Контакты</a></nav><button class="btn btn-small" id="loginBtn">Войти</button></div></header><section class="content"><h1>Контакты</h1><form id="contact-form"><input type="text" name="name" placeholder="Имя"><input type="email" name="email" placeholder="Email"><textarea name="message" placeholder="Сообщение"></textarea><button type="submit" class="btn btn-primary">Отправить</button></form></section><footer class="site-footer"><p>© 2026 FrameFlow</p></footer></div><script>document.getElementById('loginBtn').addEventListener('click', function(){ alert('Вход скоро будет доступен'); });document.getElementById('contact-form').addEventListener('submit', async function(e){e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form).entries());await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});alert('Сообщение отправлено');});</script></body></html>
