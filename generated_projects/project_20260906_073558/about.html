<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>О нас</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameFlow — О нас (фрагмент)</title>
  <!-- Подключаем шрифт и лёгкий сброс для наглядности (не каркас) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* Только базовые стили для контента, без каркаса/раскладки */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #0f172a;
    }
    /* контейнер #app — мы рендерим только внутренности, но для изоляции добавим лёгкий фон */
    #app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
      background: transparent;
    }
    /* стили секций — только оформление контента, без grid-каркаса */
    .about-hero {
      margin-bottom: 3rem;
    }
    .about-hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0a0f1e;
      margin-bottom: 1rem;
      max-width: 700px;
    }
    .about-hero .lead {
      font-size: 1.2rem;
      color: #334155;
      max-width: 720px;
      font-weight: 400;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, #d1d9e6, #b0c4de, #d1d9e6);
      margin: 2.5rem 0;
      border: none;
    }
    .story-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2.5rem;
      margin-bottom: 2rem;
    }
    .story-text {
      flex: 2 1 300px;
    }
    .story-text h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: #0f172a;
    }
    .story-text p {
      margin-bottom: 1.2rem;
      color: #1e293b;
      font-size: 1.05rem;
    }
    .story-text strong {
      color: #2563eb;
      font-weight: 600;
    }
    .stats-aside {
      flex: 1 1 200px;
      background: #ffffff;
      border-radius: 24px;
      padding: 1.8rem 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9eef3;
      align-self: flex-start;
    }
    .stats-aside h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #0f172a;
      letter-spacing: -0.01em;
    }
    .stat-item {
      margin-bottom: 1.5rem;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #2563eb;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .stat-label {
      font-size: 0.9rem;
      color: #475569;
      margin-top: 0.2rem;
    }
    .values-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin: 2.5rem 0 1.5rem;
    }
    .value-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem 1.8rem;
      flex: 1 1 200px;
      border: 1px solid #e2e8f0;
      transition: 0.2s ease;
    }
    .value-card:hover {
      border-color: #b9d0f0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.06);
    }
    .value-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .value-card h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #0f172a;
    }
    .value-card p {
      color: #334155;
      font-size: 0.95rem;
    }
    .team-section {
      margin-top: 3rem;
    }
    .team-section h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1.8rem;
      color: #0f172a;
    }
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
    }
    .team-member {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      flex: 1 1 220px;
      border: 1px solid #e2e8f0;
      text-align: center;
    }
    .member-avatar {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 1.5rem;
      box-shadow: 0 6px 12px rgba(37, 99, 235, 0.15);
    }
    .</div>
  <script src="app.js"></script>
</body>
</html>
